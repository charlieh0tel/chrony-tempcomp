[project]
name = "chrony-tempcomp"
version = "0.1.0"
description = "Temperature compensation for chrony"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.18.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["study", "tools"]

[tool.mypy]
files = ["study/pps_raw.py", "study/pps_step.py", "study/pps_cycles.py", "study/room_days.py", "study/raw_minutes.py", "study/filter_gain.py", "study/chronyd_step.py", "study/sensor_shift.py"]
ignore_missing_imports = true
mypy_path = "study"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
